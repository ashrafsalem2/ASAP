<div class="page">
  <h1>{{ t('account.password.title') }}</h1>

  <section class="panel">
    <p class="panel__body page__intro">{{ t('account.password.intro') }}</p>

    <div class="panel__body draft">
      <div class="field admin__wide">
        <label class="field__label" for="current">{{ t('account.password.current') }}</label>
        <input id="current" class="input" type="password" [(ngModel)]="current" />
      </div>

      <div class="field admin__wide">
        <label class="field__label" for="next">{{ t('account.password.new') }}</label>
        <input id="next" class="input" type="password" [(ngModel)]="next" />
      </div>

      <div class="field admin__wide">
        <label class="field__label" for="confirm">{{ t('account.password.confirm') }}</label>
        <input id="confirm" class="input" type="password" [(ngModel)]="confirm" />
      </div>

      <button
        type="button"
        class="button button--primary"
        [disabled]="!current || !next || mismatched() || busy()"
        (click)="change()"
      >
        @if (busy()) {
          <span class="spinner"></span>
        }
        {{ t('account.password.change') }}
      </button>
    </div>

    @if (mismatched()) {
      <p class="panel__body admin__warn">{{ t('account.password.mismatch') }}</p>
    }

    <p class="panel__body admin__note">{{ t('account.password.length') }}</p>
  </section>
</div>
